# Bragi — servidor de medios (Jellyfin) en el appliance midgard.
#
# Lo despliega el receptor de higerotech/despliegue-continuo (ADR-0003): en cada despliegue
# el servicio `sync` hace checkout del commit IMAGE_TAG en el clon y el resto se levanta con
# `docker compose up -d`. Consecuencia heredada de Yggdrasil: un cambio a ESTE fichero se
# aplica en el despliegue siguiente, no en el mismo.
#
# NUMEROS MEDIDOS EN EL APPLIANCE (2026-09-17, i3-3240, 2C/4T) — fundamentan los topes
#   Biblioteca: 2,2 TB; muestra de 119 ficheros: 59 % h264 8 bit, 41 % hevc 10 bit,
#               bitrate medio 3,0 Mbps, maximo 4,0.
#   Lectura NFS del NAS: 107 MB/s (856 Mbps), satura el gigabit.
#   Transcode HEVC 10 bit -> H.264 1080p por software: 1,42x sin tope, load 0,84 -> 3,41.
#   => Reproduccion directa: CPU ~0. Transcode: UNO como maximo (dos pedirian 2,84x).
#
# Por que hay topes de CPU: el 2026-09-11 se retiro Frigate (Fenrir) del appliance porque
# promediaba 45,7 % de CPU con picos del 96,5 %. El appliance es el ROUTER de la casa. La
# leccion no fue "no meter video", fue "no meter nada sin tope" (ADR-0002).

name: bragi

services:
  # --- Tarea de un solo uso: lleva el clon al commit que se despliega (ADR-0003) ---
  sync:
    image: ghcr.io/higerotech/bragi-sync:${IMAGE_TAG:?IMAGE_TAG es obligatorio}
    container_name: bragi-sync
    user: "${DEPLOY_UID:-996}:${DEPLOY_GID:-987}"   # dueño del clon en el servidor
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [bragi]                               # solo sale a github.com para el fetch
    environment:
      IMAGE_TAG: ${IMAGE_TAG}
      HOME: /tmp
    volumes:
      - ..:/repo

  jellyfin:
    # Version pineada por digest: subirla es un PR que cambia esta linea (ADR-0001).
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: bragi
    restart: unless-stopped
    depends_on:
      sync:
        condition: service_completed_successfully

    # --- Los topes (ADR-0002) ---
    # 3.0 sostiene un transcode HEVC a ~1,25x y deja un hilo entero al enrutamiento.
    # 2.0 lo deja en ~0,84x, por debajo de tiempo real. Sin tope es el caso Frigate.
    cpus: ${BRAGI_CPUS:-3.0}
    mem_limit: ${BRAGI_MEM:-2g}
    cpu_shares: 512            # bajo contencion, Bragi cede primero (la mitad del peso normal)
    pids_limit: 512

    user: "${PUID:?define PUID en .env}:${PGID:?define PGID en .env}"
    group_add:
      - "${RENDER_GID:?define RENDER_GID en .env}"
      - "${VIDEO_GID:-44}"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

    ports:
      # RS01: solo la IP LAN, nunca 0.0.0.0. El acceso externo entra por el tunel (ADR-0004).
      - "${HOST_LAN_IP:?define HOST_LAN_IP en .env}:8096:8096"
    networks: [bragi]

    # iGPU Intel HD 2500 (Gen7): NO decodifica HEVC, que es justo lo que habria que
    # transcodificar. Se mapea porque no cuesta nada; VAAPI no resuelve el cuello (ADR-0002).
    devices:
      - /dev/dri:/dev/dri

    volumes:
      # Config y cache en el disco LOCAL y FUERA del clon: Jellyfin usa SQLite, que sobre NFS
      # se corrompe, y el clon lo reescribe el sync en cada despliegue.
      - ${BRAGI_DATA:-/var/lib/bragi}/config:/config
      - ${BRAGI_DATA:-/var/lib/bragi}/cache:/cache
      # Biblioteca del NAS, SOLO LECTURA y con propagacion rslave (ADR-0005). El punto de
      # montaje del host es un autofs con idle-timeout: con la propagacion por defecto
      # (rprivate) el contenedor se queda con la vista del arranque y ve el directorio vacio
      # tras el primer desmontaje. Comprobado en midgard el 2026-09-17.
      - type: bind
        source: ${MEDIA_PATH:-/mnt/nas/media}
        target: /media
        read_only: true
        bind:
          propagation: rslave

    environment:
      TZ: ${TZ:-UTC}
      JELLYFIN_PublishedServerUrl: ${PUBLISHED_URL:-http://${HOST_LAN_IP}:8096}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s       # primer arranque sobre el HDD de 5400 rpm

    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # --- Acceso externo por Cloudflare Tunnel (ADR-0004, pendiente de HITL) ---
  # Detras del perfil `tunel`: el receptor NO lo levanta hasta que se active a proposito con
  # COMPOSE_PROFILES=tunel en el .env. Tunel propio, separado del de deploy.<dominio>, para
  # que revocar uno no tumbe el otro.
  tunel:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: bragi-tunel
    profiles: [tunel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      # Sin `:?` a proposito: compose interpola todos los servicios aunque el perfil este
      # apagado, y un `:?` aqui romperia el despliegue sin tunel. Sin token, cloudflared
      # sale con error y el contenedor queda en reinicio: fallo visible, no silencioso.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.5
    mem_limit: 128m
    networks:
      bragi:
        # IP fija: Jellyfin solo confia en X-Forwarded-For de esta direccion (KnownProxies).
        ipv4_address: ${TUNEL_IP:-172.30.50.10}
    depends_on:
      jellyfin:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  bragi:
    name: bragi
    ipam:
      config:
        - subnet: ${BRAGI_SUBNET:-172.30.50.0/24}
