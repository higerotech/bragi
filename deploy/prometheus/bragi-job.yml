# Job de scrape de Bragi — ADR-0009.
#
# ESPECIFICACION: se instala en el bloque `scrape_configs` del prometheus.yml de
# higerotech/yggdrasil. El objetivo es el contenedor bragi-metricas en la red yggdrasil_heimdall:
# el puerto 9470 no se publica.
- job_name: bragi
  scrape_interval: 30s
  metrics_path: /bragi.prom
  # busybox httpd no envia Content-Type y Prometheus 3 rechaza el scrape sin este respaldo
  # (mismo caso que Sleipnir).
  fallback_scrape_protocol: PrometheusText0.0.4
  static_configs:
    - targets: ["bragi-metricas:9470"]
