# Banco de pruebas de la frontera de confianza de Bragi (RS02, RS03, RS04, AB03).
# Lo levanta deploy/tests/prueba-proxy.sh; no se despliega nunca.
#
# Reproduce la topologia de produccion con redes propias para no chocar con la real:
#   red tunel  -> proxy (hace de cloudflared, IP de KnownProxies) e intruso (otro contenedor)
#   red lan    -> cliente que hace de equipo de la LAN (la subred de LocalNetworkSubnets)
# Jellyfin es la MISMA imagen pineada que produccion y el network.xml sale del MISMO config.sh.

name: bragi-prueba

x-cliente: &cliente
  image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  command: ["sh", "-c", "apk add -q --no-cache curl jq bash && touch /listo && sleep infinity"]
  volumes:
    - ../scripts:/scripts:ro

services:
  config:
    build: ../sync
    image: bragi-sync:prueba
    user: "1000:1000"
    entrypoint: ["/usr/local/bin/config.sh"]
    network_mode: none
    environment:
      LAN_SUBNET: 172.31.251.0/24
      TUNEL_IP: 172.31.250.10
    volumes:
      - ${PRUEBA_DIR:?}/config:/salida

  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    user: "1000:1000"
    depends_on:
      config:
        condition: service_completed_successfully
    volumes:
      - ${PRUEBA_DIR:?}/config:/config
      - ${PRUEBA_DIR:?}/cache:/cache
    networks:
      tunel: {ipv4_address: 172.31.250.2}
      lan: {ipv4_address: 172.31.251.2}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  proxy:
    <<: *cliente
    networks:
      tunel: {ipv4_address: 172.31.250.10}

  intruso:
    <<: *cliente
    networks:
      tunel: {ipv4_address: 172.31.250.20}

  lan:
    <<: *cliente
    networks:
      lan: {ipv4_address: 172.31.251.5}

networks:
  tunel:
    ipam: {config: [{subnet: 172.31.250.0/24}]}
  lan:
    ipam: {config: [{subnet: 172.31.251.0/24}]}
